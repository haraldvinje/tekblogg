packages:
  - tekblogg-web
  - tekblogg-cms
allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  sharp: true
  unrs-resolver: true
overrides:
  # Dedupe pins: one copy across the tree, or React types and the CodeMirror
  # editor state break at runtime/compile time when two versions meet.
  '@types/react': 19.3.0
  '@types/react-dom': 19.3.0
  '@codemirror/state': 6.7.6
  '@codemirror/view': 6.43.15
  # Security fixes the parent packages' own ranges don't allow yet. Same major
  # only; drop each once `pnpm audit` passes without it.
  js-yaml@<3.15.2: ^3.15.2
  postcss-selector-parser@<6.1.5: ^6.1.5
  smol-toml@<1.9.0: ^1.9.0
  undici@>=7.0.0 <7.30.1: ^7.30.1
