name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web - lint, test and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./tekblogg-web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: tekblogg-web/package.json

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm run build

  cms:
    name: CMS - lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./tekblogg-cms
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: tekblogg-cms/package.json

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Run separately: the "lint" script chains these with ";", so only tsc's exit code counts there.
      - name: Prettier
        run: pnpm exec prettier . --check

      - name: ESLint
        run: pnpm exec eslint .

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Build
        run: pnpm run build
